name: Kuro Game Monitor

on:
  schedule:
    - cron: "0 22 * * *"  # ตี 5 ไทย (22:00 UTC)
    - cron: "30 11 * * *" # 18:30 ไทย (11:30 UTC)
  workflow_dispatch:

jobs:
  prod-monitor:
    if: github.event.schedule == '0 22 * * *'
    name: Run PROD Monitor (ตี 5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install requests

      - name: Run PROD scripts
        env:
          WEBHOOK1: ${{ secrets.WEBHOOK1 }}
          WEBHOOK2: ${{ secrets.WEBHOOK2 }}
          WEBHOOK3: ${{ secrets.WEBHOOK3 }}
          WEBHOOK4: ${{ secrets.WEBHOOK4 }}
          WEBHOOK5: ${{ secrets.WEBHOOK5 }}
        run: |
          python Banner/CNPRODWin.py
          python Banner/OSPRODWin.py

      - name: Commit and Push PROD logs
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          mkdir -p kuro/log
          git add kuro/log
          if ! git diff --cached --quiet; then
            git commit -m "Update PROD logs [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
          else
            echo "No changes to commit"
          fi

  beta-monitor:
    if: github.event.schedule == '30 11 * * *'
    name: Run BETA Monitor (18:30)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install requests

      - name: Run BETA scripts
        env:
          WEBHOOK1: ${{ secrets.WEBHOOK1 }}
          WEBHOOK2: ${{ secrets.WEBHOOK2 }}
          WEBHOOK3: ${{ secrets.WEBHOOK3 }}
          WEBHOOK4: ${{ secrets.WEBHOOK4 }}
          WEBHOOK5: ${{ secrets.WEBHOOK5 }}
        run: |
          python Banner/CNBETAWin.py
          python Banner/OSBETAWin.py

      - name: Commit and Push BETA logs
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          mkdir -p kuro/log
          git add kuro/log
          if ! git diff --cached --quiet; then
            git commit -m "Update BETA logs [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
          else
            echo "No changes to commit"
          fi
