name: Kuro PROD Monitor 05:00

on:
  schedule:
    - cron: "0 22 * * *"   # 05:00 ไทย
  workflow_dispatch:

jobs:
  prod-monitor:
    name: Run PROD Monitor 05:00
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run PROD scripts
        env:
          WEBHOOK: ${{ secrets.WEBHOOK }}
          WEBHOOK1: ${{ secrets.WEBHOOK1 }}
          WEBHOOK2: ${{ secrets.WEBHOOK2 }}
          WEBHOOK3: ${{ secrets.WEBHOOK3 }}
          WEBHOOK4: ${{ secrets.WEBHOOK4 }}
          WEBHOOK5: ${{ secrets.WEBHOOK5 }}
        run: |
          python Banner/CNPRODWin.py
          python Banner/OSPRODWin.py

          # สร้าง log file ทดสอบ
          mkdir -p Kuro/log
          echo "Log created at $(date)" >> Kuro/log/prod-$(date +%s).txt

      - name: Commit and Push PROD logs
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # ใช้ path ตามโค้ด Python
          git add Kuro/log

          if ! git diff --cached --quiet; then
            git commit -m "Update PROD logs [skip ci]"
            git push https://x-access-token:${PAT}@github.com/${{ github.repository }} HEAD:Webhook
          else
            echo "No log changes to commit"
          fi

