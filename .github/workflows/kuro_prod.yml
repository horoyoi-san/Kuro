name: Kuro PROD Monitor 05:00

on:
  schedule:
    - cron: "0 22 * * *"   # 05:00 ไทย
  workflow_dispatch:

jobs:
  prod-monitor:
    name: Run PROD Monitor 05:00
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run PROD scripts
        env:
          WEBHOOK: ${{ secrets.WEBHOOK }}
          WEBHOOK1: ${{ secrets.WEBHOOK1 }}
          WEBHOOK2: ${{ secrets.WEBHOOK2 }}
          WEBHOOK3: ${{ secrets.WEBHOOK3 }}
          WEBHOOK4: ${{ secrets.WEBHOOK4 }}
          WEBHOOK5: ${{ secrets.WEBHOOK5 }}
        run: |
          python Banner/CNPRODWin.py
          python Banner/OSPRODWin.py
          mkdir -p kuro/log
          echo "Log test at $(date)" >> kuro/log/run-$(date +%s).txt

      - name: Check logs
        run: |
          echo "===== Log directory content ====="
          ls -R kuro/log || echo "No logs found"

      - name: Commit and Push PROD logs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add kuro/log
          git status
          git commit -m "Update PROD logs [skip ci]" || echo "No changes"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} HEAD:Webhook || echo "Push failed"
